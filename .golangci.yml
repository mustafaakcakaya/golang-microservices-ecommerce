run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - goconst
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - depguard

linters-settings:
  errcheck:
    check-type-assertions: true

  revive:
    rules:
      - name: exported
        disabled: true

  # Clean Architecture kuralı: domain katmanı altyapıya bağımlı olamaz.
  # .NET tarafındaki proje referans yönünün Go'daki karşılığı budur.
  depguard:
    rules:
      domain-stays-pure:
        files:
          - "**/internal/ordering/domain/**"
        deny:
          - pkg: "database/sql"
            desc: "domain katmanı kalıcılık bilmez; repository arayüzü app/infra katmanında"
          - pkg: "github.com/microsoft/go-mssqldb"
            desc: "domain katmanı veritabanı sürücüsü tanımaz"
          - pkg: "github.com/jackc/pgx"
            desc: "domain katmanı veritabanı sürücüsü tanımaz"
          - pkg: "net/http"
            desc: "domain katmanı taşıma katmanı bilmez"
          - pkg: "github.com/go-chi/chi"
            desc: "domain katmanı taşıma katmanı bilmez"
          - pkg: "github.com/segmentio/kafka-go"
            desc: "domain katmanı message broker tanımaz"
          - pkg: "github.com/rabbitmq/amqp091-go"
            desc: "domain katmanı message broker tanımaz"

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - goconst
