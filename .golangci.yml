version: "2"
linters:
  enable:
    - bodyclose
    - depguard
    - errorlint
    - goconst
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    depguard:
      rules:
        domain-stays-pure:
          files:
            - '**/internal/ordering/domain/**'
          deny:
            - pkg: database/sql
              desc: the domain knows nothing about persistence; the repository interface lives in the application layer
            - pkg: github.com/microsoft/go-mssqldb
              desc: the domain does not know database drivers
            - pkg: github.com/jackc/pgx
              desc: the domain does not know database drivers
            - pkg: net/http
              desc: the domain does not know the transport layer
            - pkg: github.com/go-chi/chi
              desc: the domain does not know the transport layer
            - pkg: github.com/segmentio/kafka-go
              desc: the domain does not know message brokers
            - pkg: github.com/rabbitmq/amqp091-go
              desc: the domain does not know message brokers
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
