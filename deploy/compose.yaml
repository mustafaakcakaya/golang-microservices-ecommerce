# Local stack:
#
#   docker compose -f deploy/compose.yaml up --build
#
# Host ports are deliberately offset from the conventional defaults, so another
# stack using them can run at the same time. Each is overridable if something
# else already holds the port:
#
#   usual       here
#   5432   ->   5442   catalog database
#   5433   ->   5443   basket database
#   1433   ->   1443   ordering database
#   6379   ->   6389   redis
#   6000   ->   6100   catalog service
#   6001   ->   6101   basket service
#   6002   ->   6102   discount service (gRPC)
#   6003   ->   6103   ordering service
#   6004   ->   6104   ordering worker (health only)
#   5672   ->   5682   rabbitmq
#  15672   ->  15682   rabbitmq management ui
#   9092   ->   9192   kafka (profile: kafka)
#
# Credentials below are local-only defaults; nothing here is meant for a
# deployed environment.

services:
  catalogdb:
    image: postgres:16-alpine
    container_name: go-catalogdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=catalog
    restart: always
    ports:
      - "${CATALOG_DB_PORT:-5442}:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  basketdb:
    image: postgres:16-alpine
    container_name: go-basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=basket
    restart: always
    ports:
      - "${BASKET_DB_PORT:-5443}:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d basket"]
      interval: 5s
      timeout: 5s
      retries: 10

  orderingdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: go-orderingdb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${ORDERING_DB_PASSWORD:-Str0ng!Passw0rd}
      # The Developer edition is licensed for development and, unlike Express,
      # supports change data capture - which the outbox reader will need.
      - MSSQL_PID=Developer
      # CDC is driven by SQL Server Agent jobs, so the agent has to be running
      # before capture can be enabled on a table.
      - MSSQL_AGENT_ENABLED=true
    restart: always
    ports:
      - "${ORDERING_DB_PORT:-1443}:1433"
    volumes:
      - mssql_ordering:/var/opt/mssql
    healthcheck:
      # A real login, not a port check: the server logs that it is ready before
      # the sa password has been applied, so connecting on the log line alone
      # races the login.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  messagebroker:
    image: rabbitmq:3.13-management-alpine
    container_name: go-messagebroker
    hostname: go-messagebroker
    restart: always
    ports:
      - "${RABBITMQ_PORT:-5682}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15682}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Started only with `--profile kafka`. The worker speaks to one broker at a
  # time, chosen by MESSAGE_BROKER_PROVIDER, so running both by default would
  # cost memory for something nothing is connected to.
  kafka:
    image: confluentinc/confluent-local:7.6.1
    container_name: go-kafka
    profiles: ["kafka"]
    restart: always
    ports:
      - "${KAFKA_PORT:-9192}:9092"
    environment:
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9192}
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  distributedcache:
    image: redis:7-alpine
    container_name: go-distributedcache
    restart: always
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog:
    container_name: go-catalog
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: catalog
    environment:
      - CATALOG_HTTP_ADDR=:8080
      - CATALOG_DATABASE_URL=postgres://postgres:postgres@catalogdb:5432/catalog?sslmode=disable
      - CATALOG_SEED=true
    depends_on:
      catalogdb:
        # The service migrates on startup, so it must not race the database.
        condition: service_healthy
    ports:
      - "${CATALOG_PORT:-6100}:8080"

  discount:
    container_name: go-discount
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: discount
    environment:
      - DISCOUNT_GRPC_ADDR=:8080
      # SQLite lives on a volume so coupons survive a container replacement.
      - DISCOUNT_DATABASE_PATH=/data/discount.db
      - DISCOUNT_SEED=true
    volumes:
      - discount_data:/data
    ports:
      - "${DISCOUNT_PORT:-6102}:8080"
    healthcheck:
      # The image has no shell tools for gRPC, so the service probes itself
      # through the standard health service using its own binary.
      test: ["CMD", "/usr/local/bin/service", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  basket:
    container_name: go-basket
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: basket
    environment:
      - BASKET_HTTP_ADDR=:8080
      - BASKET_DATABASE_URL=postgres://postgres:postgres@basketdb:5432/basket?sslmode=disable
      - BASKET_REDIS_URL=redis://distributedcache:6379/0
      - BASKET_DISCOUNT_GRPC_ADDR=discount:8080
    depends_on:
      basketdb:
        condition: service_healthy
      distributedcache:
        condition: service_healthy
      discount:
        # Basket refuses to start without Discount, so it waits for it.
        condition: service_healthy
    ports:
      - "${BASKET_PORT:-6101}:8080"

  ordering:
    container_name: go-ordering
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: ordering
    environment:
      - ORDERING_HTTP_ADDR=:8080
      # The service creates this database on startup; the server ships with
      # only its system databases.
      - ORDERING_DATABASE_URL=sqlserver://sa:${ORDERING_DB_PASSWORD:-Str0ng!Passw0rd}@orderingdb:1433?database=Ordering
      - ORDERING_SEED=true
    depends_on:
      orderingdb:
        # The service migrates on startup, so it must not race the database.
        condition: service_healthy
    ports:
      - "${ORDERING_PORT:-6103}:8080"

  ordering-worker:
    container_name: go-ordering-worker
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: ordering-worker
    environment:
      - ORDERING_WORKER_HTTP_ADDR=:8080
      - ORDERING_DATABASE_URL=sqlserver://sa:${ORDERING_DB_PASSWORD:-Str0ng!Passw0rd}@orderingdb:1433?database=Ordering
      # Switch to kafka by setting this to "kafka" and starting the stack with
      # `--profile kafka`; nothing in the worker changes.
      - MESSAGE_BROKER_PROVIDER=${MESSAGE_BROKER_PROVIDER:-rabbitmq}
      - MESSAGE_BROKER_RABBITMQ_URL=amqp://guest:guest@messagebroker:5672/
      - MESSAGE_BROKER_KAFKA_BROKERS=kafka:29092
    depends_on:
      orderingdb:
        condition: service_healthy
      messagebroker:
        condition: service_healthy
      ordering:
        # The API owns the schema, so capture exists only after it has
        # migrated. The worker waits for capture anyway, but starting in order
        # keeps the logs readable.
        condition: service_started
    ports:
      - "${ORDERING_WORKER_PORT:-6104}:8080"

volumes:
  postgres_catalog:
  postgres_basket:
  redis_data:
  discount_data:
  mssql_ordering:
  rabbitmq_data:
