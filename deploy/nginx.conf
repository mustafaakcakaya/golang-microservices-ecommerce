server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser only ever talks to this origin, so there is no cross-origin
    # request to allow and no service is exposed to the page directly.
    location /api/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app owns its own routing: /orders is a route in the page,
    # not a file on disk, so anything that is not a file falls back to the
    # entry point instead of 404ing on a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset names, so they can be cached hard; index.html must not be,
    # or a deploy would keep serving the previous build's script tags.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
